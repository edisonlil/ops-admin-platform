[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-ai-runtime-core"
version = "0.1.0"
description = "Shared AI runtime core primitives for ops-admin-platform."
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<12", "pypdf>=4,<7", "openpyxl>=3,<4"]

[tool.setuptools.packages.find]
where = ["src"]
