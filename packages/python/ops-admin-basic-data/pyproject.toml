[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-basic-data"
version = "0.1.0"
description = "Basic data bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-system",
    "ops-admin-identity-access",
]

[project.entry-points."ops_admin.routers"]
basic_data = "basic_data.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
basic_data = "basic_data.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basic_data = ["infrastructure/persistence/*.sql"]
