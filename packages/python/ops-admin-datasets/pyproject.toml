[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-datasets"
version = "0.1.0"
description = "Dataset bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-system",
    "ops-admin-identity-access",
]

[project.entry-points."ops_admin.routers"]
datasets = "datasets.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
datasets = "datasets.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datasets = ["infrastructure/persistence/*.sql"]
