[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-ai-assets"
version = "0.1.0"
description = "AI assets and prompt management bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-system",
    "ops-admin-identity-access",
    "ops-admin-llm-runtime",
]

[project.entry-points."ops_admin.routers"]
ai_assets = "ai_assets.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
ai_assets = "ai_assets.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_assets = ["infrastructure/persistence/*.sql"]
