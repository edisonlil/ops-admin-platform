[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-metadata-support"
version = "0.1.0"
description = "Metadata and tag support bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-system",
    "ops-admin-identity-access",
]

[project.entry-points."ops_admin.routers"]
metadata_support = "metadata_support.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
metadata_support = "metadata_support.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metadata_support = ["infrastructure/persistence/*.sql"]
