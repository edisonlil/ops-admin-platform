[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-llm-runtime"
version = "0.1.0"
description = "LLM runtime bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-identity-access",
    "ops-admin-system",
]

[project.entry-points."ops_admin.routers"]
llm_runtime = "llm_runtime.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
llm_runtime = "llm_runtime.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_runtime = ["infrastructure/persistence/*.sql"]
