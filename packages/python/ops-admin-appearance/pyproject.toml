[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-appearance"
version = "0.1.0"
description = "Appearance bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-identity-access",
    "ops-admin-system",
]

[project.entry-points."ops_admin.routers"]
appearance = "appearance.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
appearance = "appearance.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appearance = ["infrastructure/persistence/*.sql"]
