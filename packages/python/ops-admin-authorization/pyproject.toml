[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-authorization"
version = "0.1.0"
description = "Authorization and data-scope bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "ops-admin-system",
    "ops-admin-identity-access",
    "ops-admin-organization",
]

[project.entry-points."ops_admin.routers"]
authorization = "authorization.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
authorization = "authorization.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
authorization = ["infrastructure/persistence/*.sql"]
