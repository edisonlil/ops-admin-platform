[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-system"
version = "0.1.0"
description = "System bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "SQLAlchemy",
    "psycopg[binary]",
    "PyMySQL",
]

[project.entry-points."ops_admin.routers"]
system = "system.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
system = "system.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
system = ["infrastructure/persistence/*.sql"]
