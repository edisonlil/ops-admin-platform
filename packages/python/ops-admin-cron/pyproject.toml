[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-admin-cron"
version = "0.1.0"
description = "Cron bounded context for ops-admin-platform."
requires-python = ">=3.11"
dependencies = [
    "APScheduler>=3.10,<4",
    "fastapi",
    "ops-admin-system",
    "ops-admin-identity-access",
]

[project.entry-points."ops_admin.routers"]
cron = "cron.entrypoints:router"

[project.entry-points."ops_admin.init_tasks"]
cron = "cron.entrypoints:init_tasks"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cron = ["infrastructure/persistence/*.sql"]
